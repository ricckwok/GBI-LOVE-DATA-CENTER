    <script>
      // Ensure window.fetch is writable and has both getter/setter to prevent
      // "Cannot set property fetch of #<Window> which has only a getter" in iframe sandboxes
      (function() {
        try {
          var _fetch = window.fetch;
          if (typeof _fetch === 'function') {
            var currentFetch = _fetch;
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return currentFetch;
              },
              set: function(val) {
                currentFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // Ignore if unable to redefine
        }
      })();
    </script>
